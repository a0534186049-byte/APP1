name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 36 SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare release signing key
        shell: bash
        env:
          STABLE_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STABLE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STABLE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/neon-countdown-release.jks"

          if [[ -n "$STABLE_KEYSTORE_BASE64" && -n "$STABLE_KEYSTORE_PASSWORD" && -n "$STABLE_KEY_ALIAS" ]]; then
            printf '%s' "$STABLE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            test -s "$KEYSTORE"
            keytool -list -keystore "$KEYSTORE" -storepass "$STABLE_KEYSTORE_PASSWORD" -alias "$STABLE_KEY_ALIAS" >/dev/null
            PASSWORD="$STABLE_KEYSTORE_PASSWORD"
            ALIAS="$STABLE_KEY_ALIAS"
            echo "Using repository-provided stable signing key."
          elif [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            # Non-main builds may use a temporary key for testing only. They are never
            # published as the installable main-branch Release APK.
            PASSWORD="$(openssl rand -hex 18)"
            ALIAS="eventcountdown"
            keytool -genkeypair -noprompt -v \
              -keystore "$KEYSTORE" -storetype JKS \
              -storepass "$PASSWORD" -keypass "$PASSWORD" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Neon Event Countdown, OU=Build, O=Local, L=Local, ST=Local, C=IL"
            echo "::warning::Temporary signing key used for a non-main test build only."
          else
            echo "::error::Stable signing key not configured. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_ALIAS under Settings > Secrets and variables > Actions before building/publishing main."
            exit 1
          fi

          echo "RELEASE_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Run unit tests and build Debug and Release
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug assembleRelease

      - name: Verify APKs and enforce 30 MB limit
        shell: bash
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            test -f "$apk"
            bytes="$(stat -c '%s' "$apk")"
            echo "$apk: $bytes bytes"
            test "$bytes" -lt 30000000
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          done
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "Unexpected INTERNET permission"
            exit 1
          fi

      # Keep Actions artifacts as a backup, but the normal download path is the Release asset below.
      - name: Upload installable APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neon-countdown-apks
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/test-results/testDebugUnitTest/*.xml

      - name: Publish or update the fixed GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="latest-apk"
          apk="app/build/outputs/apk/release/app-release.apk"

          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" \
              --target "$GITHUB_SHA" \
              --title "Latest APK" \
              --notes "Automatic release for the Neon Event Countdown app. The app-release.apk asset is replaced after each successful build on main."
          fi

          gh release upload "$release_tag" "$apk" --clobber
          gh release edit "$release_tag" \
            --title "Latest APK" \
            --notes "Automatically updated from main. Latest GitHub Actions run: #$GITHUB_RUN_NUMBER (commit $GITHUB_SHA). Download app-release.apk below."

          asset_size="$(gh release view "$release_tag" --json assets --jq '.assets[] | select(.name == "app-release.apk") | .size')"
          test -n "$asset_size"
          test "$asset_size" -gt 0
          echo "Verified Release asset app-release.apk ($asset_size bytes)."
          echo "Direct download URL: https://github.com/$GITHUB_REPOSITORY/releases/download/$release_tag/app-release.apk"
